<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rahmah Fashion – শালীনতায় সৌন্দর্য, রুচিতে আভিজাত্য</title>
<meta name="description" content="Rahmah Fashion – প্রিমিয়াম বোরকা, হিজাব, নিকাব ও খিমার। সারা বাংলাদেশে ক্যাশ অন ডেলিভারি।">
<meta name="theme-color" content="#5e1236">
<link rel="icon" href="/img/circle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--m:#5e1236;--p:#8a2a5b;--c:#fbf3e8;--g:#c9a35b;--t:#2b1620;--l:#e9d8c4}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;background:var(--c);color:var(--t);padding-bottom:84px;font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 12px #5e123622;padding:8px 12px;display:flex;gap:10px;align-items:center}
header .lg{height:40px;display:block}
.sb{flex:1;display:flex;background:var(--c);border:1.5px solid var(--l);border-radius:24px;padding:0 12px;align-items:center;min-width:0}
.sb input{flex:1;border:0;background:none;padding:9px 6px;outline:0;min-width:0}
.cb{position:relative;font-size:24px}
.cb i{position:absolute;top:-6px;right:-9px;background:var(--m);color:#fff;font-size:11px;border-radius:10px;padding:0 5px;font-style:normal;min-width:18px;text-align:center}
main{max-width:1100px;margin:auto;padding:12px;animation:f .3s}
@keyframes f{from{opacity:0}}
.hero{border-radius:18px;background:linear-gradient(135deg,#4a0e2b,var(--p));color:#fff;padding:22px 18px;display:flex;align-items:center;gap:14px;overflow:hidden;border:2px solid var(--g)}
.hero h1{font-size:22px;line-height:1.35;font-weight:700}
.hero p{margin:8px 0 14px;opacity:.9;font-size:14px}
.hero img{width:36%;max-width:190px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--g)}
.cta{display:inline-block;background:var(--g);color:#3a0b21;border:0;font-weight:700;padding:10px 20px;border-radius:26px;cursor:pointer;transition:transform .15s}
.cta:active{transform:scale(.95)}
.bn{display:block;width:100%;border-radius:14px;margin-top:12px}
.h{font-size:18px;color:var(--m);margin:18px 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ct{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;font-size:13px;font-weight:600;border:1px solid var(--l);transition:transform .15s}
.ct:active{transform:scale(.96)}
.ct span{display:block;font-size:28px;margin-bottom:2px}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--l);display:flex;flex-direction:column}
.card h3{font-size:14px;font-weight:600;padding:8px 10px 0;line-height:1.35;min-height:44px}
.im{position:relative;aspect-ratio:3/4;background:#f3e6d6}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.dc{position:absolute;top:8px;left:8px;background:var(--m);color:#fff;font-size:12px;padding:1px 8px;border-radius:10px}
.so{position:absolute;inset:auto 0 0;background:#000a;color:#fff;text-align:center;font-style:normal;font-size:13px;padding:3px}
.pr{padding:2px 10px;display:flex;gap:8px;align-items:baseline}
.pr b{color:var(--m);font-size:17px}.pr s{color:#999;font-size:13px}
.sz{padding:0 10px 6px;font-size:12px;color:#7a5a68}
.card button{margin:0 8px 8px;padding:8px;border-radius:10px;border:1.5px solid var(--m);font-weight:600;font-size:13px;cursor:pointer}
.b1{background:var(--m);color:#fff;border:1.5px solid var(--m)}
.b2{background:#fff;color:var(--m)}
button:disabled{opacity:.5}
.em{text-align:center;padding:40px 10px;color:#8a6a78}
.bx{background:#fff;border-radius:14px;padding:12px;border:1px solid var(--l);display:flex;flex-direction:column;gap:10px}
.bx input,.bx select,.bx textarea{border:1.5px solid var(--l);border-radius:10px;padding:10px;background:#fffdf9;width:100%}
.bx input:focus,.bx select:focus,.bx textarea:focus{outline:2px solid var(--p);border-color:var(--p)}
button.b1{width:100%;padding:13px;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px;margin-top:6px}
button.b1.wa,.wab{background:#1faa59;border-color:#1faa59}
.wab{color:#fff;width:100%;padding:12px;border-radius:12px;border:0;font-weight:700;cursor:pointer;margin-top:8px}
.ci{display:flex;gap:10px;padding-bottom:10px;border-bottom:1px dashed var(--l)}
.ci img{width:78px;height:100px;object-fit:cover;border-radius:10px}
.ci>div{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.ci select{padding:5px;border:1px solid var(--l);border-radius:8px;background:#fff;max-width:48%}
.q{display:inline-flex;align-items:center;border:1.5px solid var(--l);border-radius:10px;overflow:hidden}
.q button{width:34px;height:32px;border:0;background:#f6ece0;font-size:18px;cursor:pointer}
.q span{min-width:34px;text-align:center;font-weight:600}
.ln{display:flex;justify-content:space-between;gap:8px}
.ln.big{font-size:18px;color:var(--m);font-weight:700;border-top:1px solid var(--l);padding-top:8px}
.rm{color:#b3261e;font-size:13px;background:none;border:0;cursor:pointer;align-self:flex-start}
.rd{display:flex;gap:10px;align-items:center;padding:10px;border:1.5px solid var(--l);border-radius:10px;cursor:pointer;font-weight:600}
.rd input{width:auto}
.pb{background:#fbf3e8;border:1px dashed var(--g);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.num{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:8px;padding:6px 10px;font-size:20px;font-weight:700;color:var(--m);letter-spacing:1px}
.num button{border:0;background:var(--m);color:#fff;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer}
.pb ol{padding-left:18px}
.lk{color:var(--p);font-weight:600;font-size:14px}
.gal{display:flex;gap:6px;margin-top:6px;overflow-x:auto}
.gal img{width:58px;height:72px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
.gal img.on{border-color:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:6px 14px;border-radius:20px;border:1.5px solid var(--l);background:#fff;cursor:pointer}
.chips button.on{background:var(--m);color:#fff;border-color:var(--m)}
.pd{display:grid;gap:14px}
.ok{text-align:center;padding:26px 14px}.ok .t{font-size:54px}
.st{background:#f3e0ea;color:var(--m);padding:2px 10px;border-radius:12px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -3px 14px #5e123622;max-width:640px;margin:auto;border-radius:16px 16px 0 0}
nav a{display:flex;flex-direction:column;align-items:center;font-size:20px;flex:1;color:#7a5a68;cursor:pointer;position:relative}
nav a span{font-size:11px;font-weight:600}nav a.on{color:var(--m)}
nav a.on::before{content:"";position:absolute;top:-6px;width:26px;height:3px;border-radius:3px;background:var(--m)}
.fw{position:fixed;right:14px;bottom:92px;z-index:25;width:52px;height:52px;border-radius:50%;background:#1faa59;display:grid;place-items:center;font-size:26px;box-shadow:0 4px 14px #0004;animation:pl 2.4s 1s 3}
@keyframes pl{50%{transform:scale(1.12)}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2b1620;color:#fff;padding:9px 18px;border-radius:22px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;font-size:14px;max-width:90%;text-align:center}
#toast.s{opacity:1}
@media(min-width:760px){.gr{grid-template-columns:repeat(4,1fr)}.cats{grid-template-columns:repeat(6,1fr)}.hero h1{font-size:32px}.pd{grid-template-columns:1fr 1fr}.hero{padding:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a href="#/"><img class="lg" src="/img/logo.png" alt="Rahmah Fashion"></a>
  <label class="sb">🔍<input id="q" placeholder="বোরকা খুঁজুন…" oninput="srch(this.value)" enterkeyhint="search"></label>
  <a class="cb" href="#/cart" aria-label="কার্ট">🛒<i id="bg">0</i></a>
</header>
<main id="app"><p class="em">লোড হচ্ছে…</p></main>
<a class="fw" id="fw" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>
<nav>
  <a href="#/" data-k="home">🏠<span>হোম</span></a>
  <a href="#/cats" data-k="cats">🛍️<span>ক্যাটাগরি</span></a>
  <a href="#/cart" data-k="cart">🛒<span>কার্ট</span></a>
  <a id="wn" target="_blank" rel="noopener">💬<span>WhatsApp</span></a>
  <a href="#/account" data-k="account">👤<span>অ্যাকাউন্ট</span></a>
</nav>
<div id="toast"></div>
<script>
const $=q=>document.querySelector(q),bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),tk=n=>'৳'+bn(Math.round(n).toLocaleString('en-US'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const DS="ঢাকা,গাজীপুর,নারায়ণগঞ্জ,নরসিংদী,মানিকগঞ্জ,মুন্সিগঞ্জ,কিশোরগঞ্জ,টাঙ্গাইল,ফরিদপুর,গোপালগঞ্জ,মাদারীপুর,রাজবাড়ী,শরীয়তপুর,চট্টগ্রাম,কক্সবাজার,কুমিল্লা,ব্রাহ্মণবাড়িয়া,চাঁদপুর,নোয়াখালী,ফেনী,লক্ষ্মীপুর,খাগড়াছড়ি,রাঙ্গামাটি,বান্দরবান,রাজশাহী,নাটোর,নওগাঁ,চাঁপাইনবাবগঞ্জ,পাবনা,সিরাজগঞ্জ,বগুড়া,জয়পুরহাট,খুলনা,বাগেরহাট,সাতক্ষীরা,যশোর,নড়াইল,মাগুরা,ঝিনাইদহ,কুষ্টিয়া,চুয়াডাঙ্গা,মেহেরপুর,বরিশাল,ভোলা,পটুয়াখালী,পিরোজপুর,ঝালকাঠি,বরগুনা,সিলেট,মৌলভীবাজার,হবিগঞ্জ,সুনামগঞ্জ,রংপুর,দিনাজপুর,গাইবান্ধা,কুড়িগ্রাম,লালমনিরহাট,নীলফামারী,পঞ্চগড়,ঠাকুরগাঁও,ময়মনসিংহ,জামালপুর,নেত্রকোণা,শেরপুর".split(',');
let S={products:[],categories:[],settings:{}},cart=JSON.parse(localStorage.rf_cart||'[]'),area='dhaka',sel={},pay='bkash',last=null,tm;
const P=id=>S.products.find(p=>p.id==id),pr=p=>Math.round(p.regular*(100-(p.disc||0))/100);
const save=()=>{localStorage.rf_cart=JSON.stringify(cart);$('#bg').textContent=bn(cart.reduce((a,i)=>a+i.qty,0))};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('s'),2200)};
const ph=p=>{const cl=['#2b1620','#5e1236','#8a2a5b','#a86a7a'][[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0)%4];return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect width="300" height="400" fill="#f3e6d6"/><path d="M150 50c-42 0-62 32-62 74l-40 240h204l-40-240c0-42-20-74-62-74z" fill="${cl}"/><ellipse cx="150" cy="112" rx="27" ry="23" fill="#f3e6d6"/><text x="150" y="388" font-size="18" text-anchor="middle" fill="#8a2a5b" font-family="serif">Rahmah Fashion</text></svg>`)};
const im=(p,i=0)=>(p.images&&p.images[i])||ph(p);
const calc=()=>{const sub=cart.reduce((a,i)=>{const p=P(i.id);return a+(p?pr(p)*i.qty:0)},0),del=cart.length?(area=='dhaka'?+S.settings.dhaka:+S.settings.outside):0;return{sub,del,tot:sub+del}};
const tots=()=>{const c=calc();return `<div class=ln><span>পণ্যমূল্য</span><b>${tk(c.sub)}</b></div><div class=ln><span>ডেলিভারি চার্জ</span><b>${tk(c.del)}</b></div><div class="ln big"><span>সর্বমোট</span><b>${tk(c.tot)}</b></div>`};
const waurl=t=>`https://wa.me/${String(S.settings.whatsapp||'8801737588395').replace(/\D/g,'')}?text=${encodeURIComponent(t)}`;
const lines=l=>l.map((i,n)=>{const p=P(i.id);return `${bn(n+1)}. ${p.name}\nসাইজ: ${i.size} | কালার: ${i.color} | পরিমাণ: ${bn(i.qty)} | দাম: ${tk(pr(p)*i.qty)}`}).join('\n\n');
const card=p=>`<div class=card><a href="#/p/${p.id}"><div class=im><img loading=lazy src="${esc(im(p))}" alt="${esc(p.name)}">${p.disc?`<b class=dc>-${bn(p.disc)}%</b>`:''}${p.stock<1?'<i class=so>স্টক শেষ</i>':''}</div><h3>${esc(p.name)}</h3></a><div class=pr><b>${tk(pr(p))}</b>${p.disc?`<s>${tk(p.regular)}</s>`:''}</div><div class=sz>সাইজ: ${esc(p.sizes.join(', '))}</div><button class=b1 ${p.stock<1?'disabled':''} onclick="add('${p.id}')">কার্টে যোগ করুন</button><button class=b2 ${p.stock<1?'disabled':''} onclick="buy('${p.id}')">অর্ডার করুন</button></div>`;
const grid=l=>l.length?`<div class=gr>${l.map(card).join('')}</div>`:'<p class=em>কোনো পণ্য পাওয়া যায়নি</p>';
const catBox=l=>`<div class=cats>${l.map(c=>`<a class=ct href="#/c/${c.id}"><span>${esc(c.icon)}</span>${esc(c.name)}</a>`).join('')}</div>`;
function addItem(id,size,color,qty){const p=P(id),x=cart.find(i=>i.id==id&&i.size==size&&i.color==color);if(x)x.qty=Math.min(p.stock,x.qty+qty);else cart.push({id,size,color,qty:Math.min(p.stock,qty)});save()}
function add(id){const p=P(id);addItem(id,p.sizes[0],p.colors[0],1);toast('কার্টে যোগ হয়েছে ✓ (সাইজ/কালার কার্টে বদলানো যাবে)')}
function buy(id){const p=P(id);addItem(id,p.sizes[0],p.colors[0],1);location.hash='#/checkout'}
function srch(v){clearTimeout(srch.t);srch.t=setTimeout(()=>{location.hash=v.trim()?'#/s/'+encodeURIComponent(v.trim()):'#/'},300)}
const R={
home(){$('#app').innerHTML=`<section class=hero><div><h1>পরিপূর্ণ পর্দায় শালীনতার অনন্য সৌন্দর্য</h1><p>আপনার পছন্দের বোরকা এখন Rahmah Fashion-এ</p><button class=cta onclick="document.getElementById('pg').scrollIntoView({behavior:'smooth'})">এখনই কেনাকাটা করুন</button></div><img src="/img/circle.png" alt="Rahmah Fashion"></section><img class=bn src="/img/banner.jpg" alt="Rahmah Fashion – Elegance in Modesty"><h2 class=h>ক্যাটাগরি</h2>${catBox(S.categories)}<h2 class=h id=pg>সব বোরকা</h2>${grid(S.products)}`},
cats(){$('#app').innerHTML=`<h2 class=h>ক্যাটাগরি</h2>${catBox(S.categories)}`},
c(id){const c=S.categories.find(x=>x.id==id);$('#app').innerHTML=`<h2 class=h>${c?esc(c.icon+' '+c.name):'ক্যাটাগরি'}</h2>${grid(S.products.filter(p=>p.cat==id))}`},
s(q){$('#q').value=q;$('#app').innerHTML=`<h2 class=h>“${esc(q)}” এর ফলাফল</h2>${grid(S.products.filter(p=>(p.name+p.desc).includes(q)))}`},
p(id,keep){const p=P(id);if(!p){location.hash='#/';return}if(!keep)sel={size:p.sizes[0],color:p.colors[0],qty:1,img:0};const n=Math.max(p.images.length,1);
$('#app').innerHTML=`<div class=pd><div><div class=im style="border-radius:14px;overflow:hidden"><img src="${esc(im(p,sel.img))}" alt="${esc(p.name)}">${p.disc?`<b class=dc>-${bn(p.disc)}%</b>`:''}</div>${n>1?`<div class=gal>${p.images.map((u,i)=>`<img class="${i==sel.img?'on':''}" src="${esc(u)}" onclick="sel.img=${i};R.p('${id}',1)">`).join('')}</div>`:''}</div>
<div class=bx><h2 style="color:var(--m);font-size:20px">${esc(p.name)}</h2><div class=pr style="padding:0"><b style="font-size:24px">${tk(pr(p))}</b>${p.disc?`<s>${tk(p.regular)}</s><span class=st>${bn(p.disc)}% ছাড়</span>`:''}</div><p>${esc(p.desc||'')}</p>
<b>সাইজ</b><div class=chips>${p.sizes.map(s=>`<button class="${s==sel.size?'on':''}" onclick="sel.size='${esc(s)}';R.p('${id}',1)">${esc(s)}</button>`).join('')}</div>
<b>কালার</b><div class=chips>${p.colors.map(s=>`<button class="${s==sel.color?'on':''}" onclick="sel.color='${esc(s)}';R.p('${id}',1)">${esc(s)}</button>`).join('')}</div>
<div class=ln><b>পরিমাণ</b><div class=q><button onclick="sel.qty=Math.max(1,sel.qty-1);R.p('${id}',1)">−</button><span>${bn(sel.qty)}</span><button onclick="sel.qty=Math.min(${p.stock},sel.qty+1);R.p('${id}',1)">+</button></div></div>
<small>${p.stock>0?'স্টকে আছে: '+bn(p.stock)+'টি':'স্টক শেষ'}</small>
<button class=b2 style="padding:12px;border-radius:12px;border:1.5px solid var(--m);font-weight:700;background:#fff;color:var(--m)" ${p.stock<1?'disabled':''} onclick="addItem('${id}',sel.size,sel.color,sel.qty);toast('কার্টে যোগ হয়েছে ✓')">🛒 কার্টে যোগ করুন</button>
<button class=b1 ${p.stock<1?'disabled':''} onclick="addItem('${id}',sel.size,sel.color,sel.qty);location.hash='#/checkout'">এখনই অর্ডার করুন</button>
<button class=wab onclick="waOne('${id}')">💬 WhatsApp-এ অর্ডার করুন</button></div></div>`},
cart(){if(!cart.length){$('#app').innerHTML=`<div class=em><div style="font-size:50px">🛒</div><p>আপনার কার্ট খালি</p><br><a class=cta href="#/" style="background:var(--m);color:#fff">কেনাকাটা শুরু করুন</a></div>`;return}
$('#app').innerHTML=`<h2 class=h>🛒 আমার কার্ট</h2><div class=bx>${cart.map((i,n)=>{const p=P(i.id);return `<div class=ci><img src="${esc(im(p))}"><div><b>${esc(p.name)}</b><div style="display:flex;gap:6px"><select onchange="cart[${n}].size=this.value;save();R.cart()">${p.sizes.map(s=>`<option ${s==i.size?'selected':''}>${esc(s)}</option>`).join('')}</select><select onchange="cart[${n}].color=this.value;save();R.cart()">${p.colors.map(s=>`<option ${s==i.color?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class=ln><div class=q><button onclick="chg(${n},-1)">−</button><span>${bn(i.qty)}</span><button onclick="chg(${n},1)">+</button></div><b style="color:var(--m)">${tk(pr(p)*i.qty)}</b></div><small>প্রতিটি ${tk(pr(p))}</small><button class=rm onclick="cart.splice(${n},1);save();R.cart()">🗑️ মুছুন</button></div></div>`}).join('')}
<select onchange="area=this.value;R.cart()"><option value=dhaka ${area=='dhaka'?'selected':''}>ঢাকা জেলার ভিতরে ডেলিভারি</option><option value=outside ${area!='dhaka'?'selected':''}>ঢাকার বাইরে ডেলিভারি</option></select>${tots()}</div><button class=b1 onclick="location.hash='#/checkout'">অর্ডার করতে এগিয়ে যান</button><button class=wab onclick="waCart()">💬 পুরো কার্ট WhatsApp-এ পাঠান</button>`},
checkout(){if(!cart.length){location.hash='#/cart';return}const c=JSON.parse(localStorage.rf_cust||'{}');if(c.ds)area=c.ds=='ঢাকা'?'dhaka':'outside';
$('#app').innerHTML=`<h2 class=h>অর্ডারের তথ্য</h2><div class=bx><input id=n placeholder="আপনার নাম *" value="${esc(c.n)}"><input id=ph placeholder="মোবাইল নম্বর * (01XXXXXXXXX)" inputmode=tel value="${esc(c.ph)}"><textarea id=ad rows=2 placeholder="সম্পূর্ণ ঠিকানা *">${esc(c.ad)}</textarea><select id=ds onchange="area=this.value=='ঢাকা'?'dhaka':'outside';tot()"><option value="">জেলা নির্বাচন করুন *</option>${DS.map(d=>`<option ${c.ds==d?'selected':''}>${d}</option>`).join('')}</select><input id=up placeholder="উপজেলা / থানা *" value="${esc(c.up)}"></div>
<h2 class=h>অর্ডার সারসংক্ষেপ</h2><div class=bx>${cart.map(i=>{const p=P(i.id);return `<div class=ln><span>${esc(p.name)}<br><small>সাইজ ${esc(i.size)} • ${esc(i.color)} • ${bn(i.qty)}টি</small></span><b>${tk(pr(p)*i.qty)}</b></div>`}).join('')}<div id=tt></div><a class=lk href="#/cart">✏️ কার্ট এডিট করুন</a></div>
<h2 class=h>পেমেন্ট পদ্ধতি</h2><div class=bx>${[['bkash','বিকাশ পেমেন্ট'],['nagad','নগদ পেমেন্ট'],['cod','ক্যাশ অন ডেলিভারি']].map(([k,l])=>`<label class=rd><input type=radio name=pm value=${k} ${pay==k?'checked':''} onchange="pay='${k}';pbox()">${l}</label>`).join('')}<div id=pb></div></div><button class=b1 id=sub onclick="place()">✅ অর্ডার কনফার্ম করুন</button>`;tot();pbox()},
done(id){const m=last&&last.id==id?last.pay:'';$('#app').innerHTML=`<div class="bx ok"><div class=t>🎉</div><h2 style="color:var(--m)">অর্ডার সফল হয়েছে!</h2><p>আপনার অর্ডার আইডি</p><b style="font-size:22px">#${esc(id)}</b><p>${m=='cod'?'পণ্য হাতে পেয়ে টাকা পরিশোধ করুন। আমরা শীঘ্রই কল করে কনফার্ম করব।':'আপনার পেমেন্ট যাচাই করে আমরা অর্ডার কনফার্ম করব। এরপর কল করা হবে।'}</p><button class=wab onclick="open(waurl('আসসালামু আলাইকুম, আমি অর্ডার করেছি। আমার অর্ডার আইডি: ${esc(id)}'),'_blank')">💬 WhatsApp-এ জানান</button><br><a class=lk href="#/">← আরও কেনাকাটা করুন</a></div>`},
async account(){const c=JSON.parse(localStorage.rf_cust||'{}'),ids=JSON.parse(localStorage.rf_orders||'[]');
$('#app').innerHTML=`<h2 class=h>👤 আমার অ্যাকাউন্ট</h2><div class=bx>${c.n?`<b>${esc(c.n)}</b><span>${esc(c.ph)}<br>${esc(c.ad)}, ${esc(c.up)}, ${esc(c.ds)}</span>`:'এখনো কোনো অর্ডার করেননি। প্রথম অর্ডারের পর আপনার তথ্য এখানে সেভ থাকবে।'}</div><h2 class=h>আমার অর্ডার</h2><div class=bx id=ol>${ids.length?'লোড হচ্ছে…':'কোনো অর্ডার নেই'}</div><h2 class=h>যোগাযোগ</h2><div class=bx><button class=wab style="margin:0" onclick="open(waurl('আসসালামু আলাইকুম'),'_blank')">💬 WhatsApp-এ মেসেজ করুন</button></div>`;
if(ids.length)try{const r=await(await fetch('/api/track?ids='+ids.join(','))).json();$('#ol').innerHTML=r.map(o=>`<div class=ln><span>#${o.id}<br><small>${tk(o.total)}</small></span><b class=st style="align-self:center">${esc(o.status)}</b></div>`).join('')||'—'}catch(e){}}
};
function chg(n,d){const p=P(cart[n].id);cart[n].qty=Math.max(1,Math.min(p.stock,cart[n].qty+d));save();R.cart()}
function tot(){$('#tt').innerHTML=tots();const a=$('#pamt');if(a)a.textContent=tk(calc().tot)}
function pbox(){const b=$('#pb');if(pay=='cod'){b.innerHTML='<div class=pb>📦 পণ্য হাতে পেয়ে টাকা দিন। নিচের বাটনে চাপ দিয়ে অর্ডার কনফার্ম করুন।</div>';return}
const k=pay=='bkash'?['বিকাশ',S.settings.bkash,'*247#']:['নগদ',S.settings.nagad,'*167#'];
b.innerHTML=`<div class=pb><b>${k[0]} নম্বর (Send Money):</b><div class=num><span id=pn>${esc(k[1])}</span><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(k[1])}');toast('নম্বর কপি হয়েছে')">কপি</button></div><ol><li>${k[0]} অ্যাপ বা ${k[2]} ডায়াল করে উপরের নম্বরে Send Money করুন</li><li>পরিমাণ: <b id=pamt></b></li><li>নিচে আপনার ${k[0]} নম্বর ও Transaction ID লিখুন</li></ol><input id=snd inputmode=tel placeholder="আপনার ${k[0]} নম্বর"><input id=trx placeholder="Transaction ID *"></div>`;tot()}
async function place(){const v=id=>($('#'+id)?.value||'').trim();const b={name:v('n'),phone:v('ph'),address:v('ad'),district:v('ds'),upazila:v('up'),pay,trx:v('trx'),sender:v('snd'),items:cart};
if(!b.name||!/^01\d{9}$/.test(b.phone.replace(/\D/g,'').replace(/^880/,'0'))||!b.address||!b.district||!b.upazila)return toast('সব তথ্য সঠিকভাবে দিন');
if(pay!='cod'&&!b.trx)return toast('Transaction ID দিন');
const btn=$('#sub');btn.disabled=true;btn.textContent='অপেক্ষা করুন…';
try{const r=await fetch('/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error);
localStorage.rf_cust=JSON.stringify({n:b.name,ph:b.phone,ad:b.address,ds:b.district,up:b.upazila});
const o=JSON.parse(localStorage.rf_orders||'[]');o.unshift(j.id);localStorage.rf_orders=JSON.stringify(o.slice(0,30));
last={id:j.id,pay};cart=[];save();location.hash='#/done/'+j.id}catch(e){toast(e.message||'সমস্যা হয়েছে, আবার চেষ্টা করুন');btn.disabled=false;btn.textContent='✅ অর্ডার কনফার্ম করুন'}}
function waCart(){const c=calc();open(waurl(`আসসালামু আলাইকুম, Rahmah Fashion থেকে অর্ডার করতে চাই:\n\n${lines(cart)}\n\nপণ্যমূল্য: ${tk(c.sub)}\nডেলিভারি: ${tk(c.del)}\nসর্বমোট: ${tk(c.tot)}\n\nনাম:\nমোবাইল:\nঠিকানা:`),'_blank')}
function waOne(id){const p=P(id),i={id,size:sel.size,color:sel.color,qty:sel.qty};open(waurl(`আসসালামু আলাইকুম, আমি এই বোরকাটি অর্ডার করতে চাই:\n\n${lines([i])}\n\nনাম:\nমোবাইল:\nঠিকানা:`),'_blank')}
function route(){const h=location.hash.slice(2).split('/'),k=h[0]||'home';if(k!='s')$('#q').value='';(R[k]||R.home)(decodeURIComponent(h.slice(1).join('/')));scrollTo(0,0);
document.querySelectorAll('nav a[data-k]').forEach(a=>a.classList.toggle('on',a.dataset.k==(k=='c'?'cats':k=='checkout'?'cart':k)))}
async function init(){try{S=await(await fetch('/api/store')).json()}catch(e){$('#app').innerHTML='<p class=em>সংযোগ সমস্যা। ইন্টারনেট চেক করে পেজ রিফ্রেশ করুন।</p>';return}
cart=cart.filter(i=>P(i.id));save();const w=waurl('আসসালামু আলাইকুম, Rahmah Fashion থেকে জানতে চাই');$('#fw').href=$('#wn').href=w;addEventListener('hashchange',route);route()}
init();
</script>
</body>
</html>
